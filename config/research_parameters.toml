# Single source for the project's research parameters. Scripts and tests read this file.

[question]
central = "Which technological capabilities, patent assets and investment priorities — observable in publicly available data — are most important for developing a sovereign LEO satellite communications capability for Ukraine and European government customers?"

[scope]
labels = ["SAT", "ISL", "GRD", "NET", "SEC"]
all_classes = ["SAT", "ISL", "GRD", "NET", "SEC", "OTHER", "MULTI"]
reference_company = "Nokia"
core_peers = ["Airbus", "Thales", "Viasat", "Eutelsat/OneWeb", "ICEYE"]
global_reference = "SpaceX"
offices = ["US", "EP", "CN", "JP"]
filings_since = 19961101
twenty_year_cutoff = 20061101
possibly_pending_since = 20210101
main_comparison_years = [2020, 2024]
provisional_years = [2025, 2026]

[retrieval_pools]
# Amended satcom pools, accepted 11 November 2026 (pilot decisions R1-R5).
# ISL is a reporting flag inside SAT, not a standalone bucket (R5).
# Free-space optical patents count as ISL by code definition (R4).
SAT = ["H04B7/195", "H04B7/1851"]
SAT_exclude = ["H04B7/18517"]
ISL = ["H04B7/18521", "H04B10/118"]
GRD = ["H04B7/18517", "H04B7/18528"]
NET = ["H04W84/06", "H04B7/18584", "H04B7/18541"]
# SEC is a co-occurrence rule (R1): any satellite prefix above AND one security prefix below.
SEC_security = ["H04K1/", "H04K3/"]

# Archived pre-pivot values. The pre-pivot validation record (manual_labels.csv,
# validation_slots.csv, score_validation.py) is checked against these, not against [scope].
[pre_pivot]
labels = ["OPT", "IPR", "DCS"]
all_classes = ["OPT", "IPR", "DCS", "OTHER", "MULTI"]
codebook_version = "1.1"

[validation]
codebook_version = "2.0"
precision_bar = 0.85
kappa_bar = 0.70
review_statuses = ["pending", "adjudicated", "accepted"]
confidence_levels = ["High", "Medium", "Low"]
priority_periods = [[0, 20101231, "to 2010"], [20110101, 20151231, "2011-2015"], [20160101, 20201231, "2016-2020"], [20210101, 99999999, "2021 on"]]

[lineage_names]
Nokia = "nokia|alcatel|lucent|infinera"
Ciena = "ciena"
Cisco = "cisco|acacia|luxtera"
Arista = "arista"
Huawei = "huawei"

[us_fees_large_entity_usd]
# Check against the USPTO fee schedule before use, because fees change.
year_3_5 = 2150
year_7_5 = 4040
year_11_5 = 8280

[model]
horizon_years = 10
discount_rates = [0.05, 0.10, 0.15]
